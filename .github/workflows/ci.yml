name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  robustness-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run_recovery_suite.py

  performance-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run_performance_alignment.py

  error-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run_error_intelligence.py

  duet-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run_duet_research.py

  quartet-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/run_quartet_research.py

  matchmaker-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FluidSynth runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,matchmaker]"
      - run: >-
          pytest
          tests/integration/test_matchmaker_baseline.py
          tests/integration/test_matchmaker_streaming.py
          tests/integration/test_matchmaker_audio_streaming.py
      - run: python benchmarks/run_matchmaker_baseline.py
      - run: python benchmarks/run_matchmaker_streaming_smoke.py
      - run: python benchmarks/run_matchmaker_audio_streaming_smoke.py
      - run: python benchmarks/run_symbolic_comparison.py
      - run: python benchmarks/run_guitar_baseline.py
